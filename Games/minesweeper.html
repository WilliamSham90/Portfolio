<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minesweeper · William Sham</title>
    <meta name="description" content="Classic Minesweeper with three difficulty levels, chording and best times.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E💣%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/minesweeper.css">
</head>
<body>
    <a class="back-btn" href="../index.html#play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back</span>
    </a>

    <main class="game-container">
        <div class="toolbar">
            <div class="levels" role="group" aria-label="Difficulty">
                <button class="level-btn" type="button" data-level="easy" aria-pressed="true">Easy</button>
                <button class="level-btn" type="button" data-level="medium" aria-pressed="false">Medium</button>
                <button class="level-btn" type="button" data-level="hard" aria-pressed="false">Hard</button>
            </div>
            <div class="action-selector" role="group" aria-label="What a tap does">
                <button class="mode-btn" type="button" id="modeMine" aria-pressed="true" aria-label="Tap reveals" title="Tap reveals">⛏</button>
                <button class="mode-btn" type="button" id="modeFlag" aria-pressed="false" aria-label="Tap flags" title="Tap flags (F)">🚩</button>
            </div>
        </div>

        <div class="board-frame">
            <div class="infos">
                <div class="led" title="Mines left"><span class="sr-only">Mines left: </span><span id="mineCount">010</span></div>
                <button class="face" type="button" id="face" aria-label="New game (F2)">🙂</button>
                <div class="led" title="Time"><span class="sr-only">Seconds: </span><span id="timerDisplay">000</span></div>
            </div>
            <div class="grid" id="grid" aria-label="Minefield. Arrow keys move, Enter reveals, F flags."></div>

            <div class="overlay" id="overlay" hidden>
                <div class="overlay-content" role="status">
                    <p class="overlay-title" id="overlayTitle"></p>
                    <p class="overlay-text" id="overlayText"></p>
                    <button class="overlay-btn" type="button" id="overlayBtn">Play again</button>
                </div>
            </div>
        </div>

        <p class="help">Tap to reveal · long-press or right-click to flag · tap a number to clear around it</p>
    </main>

    <script src="js/minesweeper.js"></script>
</body>
</html>
