<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tower Blocks · William Sham</title>
    <meta name="description" content="Stack the sliding blocks as high as you can. Perfect drops keep the block full size.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🧱%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tower_blocks.css">
</head>
<body>
    <a class="back-btn" href="../index.html#play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back</span>
    </a>

    <div id="container">
        <div id="game" aria-label="Tower Blocks"></div>
        <div id="score" aria-live="polite">0</div>
        <div id="perfect" aria-hidden="true"></div>
        <div id="instructions">Tap or press Space to drop the block</div>

        <div class="game-over" role="status">
            <h2>Game over</h2>
            <p id="final-text"></p>
            <p>Tap or press Space to play again</p>
        </div>
        <div class="game-ready">
            <button id="start-button" type="button">Start</button>
            <p class="best" id="best-text"></p>
        </div>
    </div>

    <!-- three.js r83 (the API this game is written against) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
    <!-- GSAP 3, shared with the portfolio (already cached from the main site) -->
    <script src="../Vendor/gsap.min.js"></script>
    <script src="js/tower_blocks.js"></script>
</body>
</html>
