<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pong · William Sham</title>
    <meta name="description" content="Classic Pong: beat the computer through ten rounds or play a friend on the same screen.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🏓%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/pong.css">
</head>
<body>
    <a class="back-btn" href="../index.html#play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back</span>
    </a>

    <main class="game-wrapper">
        <div class="hud">
            <p class="round" id="roundInfo" aria-live="polite">Pong</p>
            <div class="hud-btns">
                <button class="ui-btn" id="pause-btn" type="button" aria-label="Pause (Esc)" disabled>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><polygon points="6,4 20,12 6,20"/></svg>
                </button>
                <button class="ui-btn" id="sound-btn" type="button" aria-label="Sound" aria-pressed="true">
                    <svg class="icon-sound-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg class="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
            </div>
        </div>

        <div class="game-container">
            <canvas id="pong-canvas" aria-label="Pong court"></canvas>

            <div class="screen" id="menu">
                <h1>Pong</h1>
                <p>Beat the computer through ten rounds, or grab a friend.</p>
                <div class="mode-btns">
                    <button class="big-btn" type="button" data-mode="1">1 player</button>
                    <button class="big-btn alt" type="button" data-mode="2">2 players</button>
                </div>
                <p class="best" id="bestInfo" hidden></p>
            </div>

            <div class="screen" id="pausedScreen" hidden>
                <h2>Paused</h2>
                <button class="big-btn" type="button" id="resumeBtn">Resume</button>
            </div>

            <div class="screen" id="resultScreen" hidden>
                <h2 id="resultTitle"></h2>
                <p id="resultText"></p>
                <div class="mode-btns">
                    <button class="big-btn" type="button" id="againBtn">Play again</button>
                    <button class="big-btn alt" type="button" id="menuBtn">Menu</button>
                </div>
            </div>
        </div>

        <p class="instructions" id="instructions">Keyboard: W / S or ↑ / ↓ · Esc pauses · On touch: drag on your side of the court</p>
        <p class="rotate-tip">Tip: turn your phone sideways for a bigger court.</p>
    </main>

    <script src="js/pong.js"></script>
</body>
</html>
