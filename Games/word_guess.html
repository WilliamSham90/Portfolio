<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Guess · William Sham</title>
    <meta name="description" content="Guess the hidden web and tech word before your ten lives run out.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🔤%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/word_guess.css">
</head>
<body>
    <a class="back-btn" href="../index.html#play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back</span>
    </a>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound">🔊</button>

    <main class="hangman">
        <h1 class="game-title">Word Guess</h1>

        <dl class="stats">
            <div><dt>Streak</dt><dd id="streak">0</dd></div>
            <div><dt>Best</dt><dd id="bestStreak">0</dd></div>
            <div><dt>Wins</dt><dd id="wins">0</dd></div>
        </dl>

        <div class="guess" aria-live="polite"></div>

        <div class="lives-row">
            <div class="lives" id="lives" aria-hidden="true"></div>
            <p class="lives-text" id="livesText" aria-live="polite">10 lives left</p>
        </div>

        <div class="hint-row">
            <button class="hint-btn" id="hintBtn" type="button" aria-expanded="false" aria-controls="hint">💡 Show a hint</button>
            <p class="hint" id="hint" hidden></p>
        </div>

        <div class="keyboard" id="keyboard" aria-label="Letters">
            <div class="keyboard-row"></div>
            <div class="keyboard-row"></div>
            <div class="keyboard-row"></div>
        </div>
        <p class="help">Type on your keyboard or tap the letters.</p>
    </main>

    <div class="message" id="message" role="dialog" aria-modal="true" aria-labelledby="msgTitle" hidden>
        <h2 class="title" id="msgTitle"></h2>
        <p class="text" id="msgText"></p>
        <button class="restart button" id="restartBtn" type="button">Play again</button>
        <p class="message-help">or press Enter</p>
    </div>

    <script src="js/word_guess.js"></script>
</body>
</html>
