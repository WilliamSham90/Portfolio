<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platformer · William Sham</title>
    <meta name="description" content="Bounce, swim and dodge lava to reach the yellow goal. How fast can you do it?">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23FF9900'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/platformer.css">
</head>
<body>
    <a class="back-btn" href="../index.html#play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back</span>
    </a>

    <main class="game-container">
        <div class="hud">
            <p>Time <b id="time">0.0s</b></p>
            <p>Deaths <b id="deaths">0</b></p>
            <p>Best <b id="best">–</b></p>
            <button class="restart-btn" id="restartBtn" type="button" aria-label="Restart (R)" title="Restart (R)">↻</button>
        </div>

        <div class="stage" id="stage">
            <canvas id="canvas" aria-label="Platformer level. Find the yellow goal."></canvas>
            <p class="toast" id="toast" role="status" aria-live="polite"></p>
            <div class="screen" id="winScreen" hidden>
                <h2>You found the goal! 🎉</h2>
                <p id="winText"></p>
                <button class="big-btn" type="button" id="againBtn">Play again</button>
            </div>
        </div>

        <ul class="legend" aria-label="What the colours mean">
            <li><i style="background:#FADF73"></i>Goal</li>
            <li><i style="background:#E373FA"></i>Bouncy</li>
            <li><i style="background:#C93232"></i>Lava</li>
            <li><i style="background:rgba(121,220,242,.6)"></i>Water</li>
            <li><i style="background:#0FF"></i>Switch opens the gate</li>
        </ul>
        <p class="instructions">← → or A D to move · ↑, W or Space to jump · R restarts</p>
    </main>

    <div class="mobile-controls" aria-label="Game controls">
        <button class="control-btn" type="button" data-key="left" aria-label="Move left">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>
        </button>
        <button class="control-btn" type="button" data-key="right" aria-label="Move right">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 12l-8 8v-5h-8v-6h8v-5z"/></svg>
        </button>
        <button class="control-btn jump" type="button" data-key="up" aria-label="Jump">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        </button>
    </div>

    <script src="js/platformer.js"></script>
</body>
</html>
